        <div class="mono" style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">https://mcp.deploychan.webcam/mcp</div>
      </div>
      <button class="mono" data-copy="https://mcp.deploychan.webcam/mcp" style="border:0;border-left:2px solid var(--fg);background:var(--accent);color:var(--bg);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:0 18px;cursor:pointer;min-width:72px">COPY</button>
    </div>
    <h2 class="dh">${esc(t.manualH2)}</h2>
    <p class="lead" style="color:var(--muted)">${esc(t.manualText)}</p>
    ${CLIENTS.map(c => `
      <div id="${c.anchor}" class="card" style="max-width:640px;box-shadow:4px 4px 0 var(--fg);scroll-margin-top:74px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:2px dashed var(--fg)">
          <span style="font:700 14px 'Space Grotesk'">${esc(c.label)}</span>
          <div style="display:flex;align-items:center;gap:10px"><span class="mono" style="font-size:12px;color:var(--muted)">${esc(state.lang === 'en' ? c.subEn : c.subRu)}</span><button class="btn" data-copy="${esc(c.code)}" style="padding:3px 8px;background:var(--card)">copy</button></div>
        </div>
        <pre class="mono" style="font-weight:500;font-size:12.5px;line-height:1.6;background:var(--fg);color:var(--bg);padding:14px 16px">${esc(c.code)}</pre>
      </div>`).join('')}
  </section>

  <section id="tool-knowledge">
    <div><div class="kicker">${esc(t.toolWord)} 01</div><h1 class="dh" style="margin-top:10px">${esc(t.knH1)}</h1></div>
    <p class="lead">${esc(t.knLead)}</p>
    ${toolCard('search_knowledge(query)', pr(t, t.paramsLabel, param('query', t.knQueryDesc)) + pr(t, t.returnsLabel, muted(t.knRet)))}
    <h2 class="dh">${esc(t.exampleLabel)}</h2>
    <pre class="ex">${esc(t.knCode)}</pre>
  </section>

  <section id="tool-skills">
    <div><div class="kicker">${esc(t.toolWord)} 02</div><h1 class="dh" style="margin-top:10px">${esc(t.skH1)}</h1></div>
    <p class="lead">${esc(t.skLead)}</p>
    ${toolCard('list_skills()', pr(t, t.paramsLabel, muted(t.noParams)) + pr(t, t.returnsLabel, muted(t.skListRet)))}
    ${toolCard('get_skill(id)', pr(t, t.paramsLabel, param('id', t.skGetParam)) + pr(t, t.returnsLabel, muted(t.skGetRet)))}
    <h2 class="dh">${esc(t.exampleLabel)}</h2>
    <pre class="ex">${esc(t.skCode)}</pre>
  </section>

  <section id="tool-routes">
    <div><div class="kicker">${esc(t.toolWord)} 03</div><h1 class="dh" style="margin-top:10px">${esc(t.rtH1)}</h1></div>
    <p class="lead">${esc(t.rtLead)}</p>
    ${toolCard('onboard(goal)', pr(t, t.paramsLabel, param('goal', t.rtOnboardParam)) + pr(t, t.returnsLabel, muted(t.rtOnboardRet)))}
    ${toolCard('next_step(step_id)', pr(t, t.paramsLabel, param('step_id', t.rtNextParam)) + pr(t, t.returnsLabel, muted(t.rtNextRet)))}
    <h2 class="dh">${esc(t.exampleLabel)}</h2>
    <pre class="ex">${esc(t.rtCode)}</pre>
  </section>

  <section id="tool-recommended">
    <div><div class="kicker">${esc(t.toolWord)} 04</div><h1 class="dh" style="margin-top:10px">${esc(t.rcH1)}</h1></div>
    <p class="lead">${esc(t.rcLead)}</p>
    ${toolCard('list_recommended()', pr(t, t.paramsLabel, muted(t.noParams)) + pr(t, t.returnsLabel, muted(t.rcRet)))}
    <h2 class="dh">${esc(t.exampleLabel)}</h2>
    <pre class="ex">${esc(t.rcCode)}</pre>
  </section>

  <section id="self-host">
    <div><div class="kicker">${esc(t.shKicker)}</div><h1 class="dh" style="margin-top:10px">${esc(t.shH1)}</h1></div>
    <p class="lead">${esc(t.shLead)}</p>
    <h2 class="dh">${esc(t.shStepsH2)}</h2>
    <pre class="ex">${esc(t.shCode)}</pre>
    <div class="card" style="display:flex;gap:11px;align-items:flex-start;max-width:640px;box-shadow:4px 4px 0 var(--fg);padding:14px 16px">
      <span class="mono" style="font-weight:700;font-size:18px;color:var(--accent);line-height:1.1;flex:none">↳</span>
      <div style="font:500 14px/1.55 'Space Grotesk'">${esc(t.shNote)}</div>
    </div>
    <a href="https://github.com/howdeploy/deploychan_mcp" target="_blank" rel="noopener" class="btn" style="align-self:flex-start;text-decoration:none;background:var(--accent);color:var(--bg);box-shadow:3px 3px 0 var(--fg);padding:11px 18px;font-size:12px">${esc(t.shRepoBtn)}</a>
  </section>

  <section id="security">
    <h1 class="dh">${esc(t.sec.security)}</h1>
    <h2 class="dh">${esc(t.accessH2)}</h2>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:640px">${t.accessCards.map(c => `<div style="border:1px solid var(--fg);padding:11px 13px;font:500 14px/1.5 'Space Grotesk'">${esc(c)}</div>`).join('')}</div>
    <h2 class="dh">${esc(t.dataH2)}</h2>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:640px">${t.dataCards.map(c => `<div style="border:1px solid var(--fg);padding:11px 13px;font:500 14px/1.5 'Space Grotesk'">${esc(c)}</div>`).join('')}</div>
    <h2 class="dh">${esc(t.skillsH2)}</h2>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:640px">${t.skillsCards.map(c => `<div style="border:1px solid var(--fg);padding:11px 13px;font:500 14px/1.5 'Space Grotesk'">${esc(c)}</div>`).join('')}</div>
    <div style="display:flex;gap:11px;align-items:flex-start;border:2px solid var(--accent);background:var(--card);box-shadow:4px 4px 0 var(--accent);padding:14px 16px;max-width:640px">
      <span class="mono" style="font-weight:700;font-size:20px;color:var(--accent);line-height:1.1;flex:none">!</span>
      <div style="font:500 14px/1.55 'Space Grotesk'"><b style="color:var(--accent)">${esc(t.riskBold)}</b>${esc(t.riskRest)}</div>
    </div>
  </section>`;
}

function buildSidebar(t) {
  const groups = [
    {title: t.gStart, ids: ['intro', 'quickstart']},
    {title: t.gTools, ids: ['tool-knowledge', 'tool-skills', 'tool-routes', 'tool-recommended']},
    {title: t.gRef, ids: ['self-host', 'security']}
  ];
  const q = state.q.trim().toLowerCase();
  return groups.map(g => {
    const items = g.ids.filter(id => !q || t.sec[id].toLowerCase().includes(q));
    if (!items.length) return '';
    return `<div style="margin-bottom:20px">
      <div class="mono" style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);padding:0 12px;margin-bottom:8px">${esc(g.title)}</div>
      <div style="display:flex;flex-direction:column;gap:1px">
        ${items.map(id => {
          const on = id === state.active;
          return `<a href="#${id}" data-nav="${id}" style="display:block;text-decoration:none;border-left:3px solid ${on ? 'var(--accent)' : 'transparent'};background:${on ? 'var(--cardd)' : 'transparent'};color:${on ? 'var(--fg)' : 'var(--muted)'};font:${on ? 700 : 500} 14px 'Space Grotesk';letter-spacing:-.01em;padding:8px 12px">${esc(t.sec[id])}</a>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function render() {
  const t = STR[state.lang];
  $('#site').setAttribute('data-theme', state.theme);
  document.documentElement.lang = state.lang;
  $('#themeBtn').innerHTML = state.theme === 'mocha' ? SUN : MOON;
  $('#toSite').textContent = t.toSite;
  $('#footerR').textContent = t.footerR;
  $('#search').placeholder = t.searchPh;
  const acc = 'var(--accent)', bg = 'var(--bg)', card = 'var(--card)', fg = 'var(--fg)';
  $('#langRu').style.background = state.lang === 'ru' ? acc : card;
  $('#langRu').style.color = state.lang === 'ru' ? bg : fg;
  $('#langEn').style.background = state.lang === 'en' ? acc : card;
  $('#langEn').style.color = state.lang === 'en' ? bg : fg;
  $('#main').innerHTML = buildMain(t);
  $('#sidebar').innerHTML = buildSidebar(t);
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    try { navigator.clipboard.writeText(b.getAttribute('data-copy')); } catch (e) {}
    const p = b.textContent; b.textContent = '✓'; setTimeout(() => b.textContent = p, 1200);
  });
}

function onScroll() {
  let active = SECTION_IDS[0];
  for (const id of SECTION_IDS) {
    const el = document.getElementById(id);
    if (el && el.getBoundingClientRect().top <= 150) active = id;
  }
  const doc = document.documentElement;
  if (window.innerHeight + window.scrollY >= doc.scrollHeight - 4) active = SECTION_IDS[SECTION_IDS.length - 1];
  if (active !== state.active) { state.active = active; $('#sidebar').innerHTML = buildSidebar(STR[state.lang]); }
}

$('#themeBtn').onclick = () => { state.theme = state.theme === 'mocha' ? 'dawn' : 'mocha'; localStorage.setItem('dc_theme', state.theme); render(); };
$('#langRu').onclick = () => { state.lang = 'ru'; localStorage.setItem('dc_lang', 'ru'); render(); };
$('#langEn').onclick = () => { state.lang = 'en'; localStorage.setItem('dc_lang', 'en'); render(); };
$('#search').oninput = (e) => { state.q = e.target.value; $('#sidebar').innerHTML = buildSidebar(STR[state.lang]); };
window.addEventListener('scroll', () => { if (window._raf) return; window._raf = requestAnimationFrame(() => { window._raf = null; onScroll(); }); }, { passive: true });

render();
onScroll();
</script>
</body>
</html>
